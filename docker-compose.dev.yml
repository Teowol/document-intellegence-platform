# Development compose: only infrastructure services (PostgreSQL + Redis).
# Django runs locally via `python manage.py runserver` for fast iteration.
# Usage: docker compose -f docker-compose.dev.yml up -d

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: dip-db
    environment:
      POSTGRES_DB: document_intelligence
      POSTGRES_USER: dip_user
      POSTGRES_PASSWORD: dip_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dip_user -d document_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
