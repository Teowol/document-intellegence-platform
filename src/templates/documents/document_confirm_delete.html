{% extends "base.html" %}
{% block title %}Delete document{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body text-center">
        <h1 class="h4">Delete "{{ document.title }}"?</h1>
        <p class="text-muted">This removes the file and cannot be undone.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Yes, delete</button>
          <a href="{% url 'documents:detail' document.pk %}" class="btn btn-link">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
