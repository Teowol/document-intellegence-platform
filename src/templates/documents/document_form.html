{% extends "base.html" %}
{% block title %}Upload document{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h3 mb-3">Upload document</h1>
        <p class="text-muted small">Allowed: PDF, Excel (xlsx), CSV, TXT, Markdown — max 25 MB. File type is verified by content, not by extension.</p>
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary">Upload</button>
          <a href="{% url 'documents:list' %}" class="btn btn-link">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
